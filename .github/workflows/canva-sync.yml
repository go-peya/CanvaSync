name: Canva Sync

on:

  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:


jobs:

  sync:

    runs-on: ubuntu-latest

    steps:

      # Descargar repositorio
      - name: Checkout repository
        uses: actions/checkout@v4


      # Instalar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # Instalar dependencias de Playwright
      - name: Install dependencies
        run: npm install
        working-directory: scripts


      # Instalar navegador Chromium
      - name: Install Chromium
        run: npx playwright install chromium
        working-directory: scripts


      # Ejecutar captura de Canva
      - name: Capture Canva graphics
        run: node capture.js
        working-directory: scripts


      # Verificar que la imagen fue creada correctamente
      - name: Verify generated files
        run: |
          echo "Archivos actuales:"
          ls -la
          echo "Carpeta capturas:"
          ls -la capturas


      # Guardar cambios de imágenes
      - name: Commit PNG
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add capturas/

          git commit -m "Actualizar capturas Canva" || echo "Sin cambios"

          git push
